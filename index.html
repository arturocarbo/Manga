<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Fio - Tu Biblioteca & Estadísticas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería para Celebración de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #FF4757;
            --primary-hover: #FF6B81;
            --bg-body: #F4F6F9;
            --bg-card: #FFFFFF;
            --text-main: #2F3542;
            --text-muted: #747D8C;
            --border-color: #E4E7EB;
            --shadow: 0 8px 24px rgba(149, 157, 165, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: var(--bg-card);
            padding: 18px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #FF4757, #FF6B81);
            color: white; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .brand h1 { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
        .brand p { font-size: 0.8rem; color: var(--text-muted); }

        .lang-toggle {
            display: flex; background: #F1F2F6;
            padding: 4px; border-radius: 30px; gap: 4px;
        }

        .lang-btn {
            border: none; background: transparent;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.82rem; font-weight: 600; cursor: pointer;
            color: var(--text-muted); transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--primary); color: white;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.3);
        }

        /* NAVEGACIÓN PRINCIPAL DE 3 PESTAÑAS */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px 8px; border: none;
            background: var(--bg-card); border-radius: 12px;
            font-weight: 600; font-size: 0.85rem; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 6px; box-shadow: var(--shadow); transition: all 0.2s ease;
        }

        .tab-btn.active { background: var(--primary); color: white; }

        /* VISTA DE ESTADÍSTICAS GAMIFICADAS */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stats-hero-card {
            background: linear-gradient(135deg, #2F3542 0%, #1E222B 100%);
            color: white;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 25px rgba(47, 53, 66, 0.25);
            position: relative;
            overflow: hidden;
        }

        .rank-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #FFEAA7;
            border: 1px solid rgba(255, 234, 167, 0.3);
            margin-top: 8px;
            margin-bottom: 16px;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 4px rgba(255, 234, 167, 0.2); }
            to { box-shadow: 0 0 14px rgba(255, 234, 167, 0.7); }
        }

        .stats-grid-metric {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .metric-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .metric-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .metric-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .progress-track {
            width: 100%; height: 12px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px; overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #FF4757, #FFA502, #2ED573);
            border-radius: 10px; transition: width 0.6s ease;
        }

        /* SUB-FILTROS DE BIBLIOTECA */
        .lib-filters {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
        }

        .lib-chip {
            padding: 8px 16px; border-radius: 20px;
            border: 1px solid var(--border-color); background: var(--bg-card);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-muted);
        }

        .lib-chip.active {
            background: var(--text-main); color: white; border-color: var(--text-main);
        }

        /* BUSCADOR Y TARJETAS */
        .search-box {
            background: var(--bg-card); padding: 16px;
            border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 24px;
        }

        .input-group { display: flex; gap: 10px; }
        .input-group input {
            flex: 1; padding: 12px 18px; border: 2px solid var(--border-color);
            border-radius: 12px; outline: none; font-size: 0.95rem;
        }

        .input-group button {
            background: var(--primary); color: white; border: none;
            padding: 12px 22px; border-radius: 12px; font-weight: 600; cursor: pointer;
        }

        .suggestions {
            display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center;
        }

        .chip {
            background: #F1F2F6; border: none; padding: 4px 12px;
            border-radius: 16px; font-size: 0.8rem; color: var(--text-main); cursor: pointer;
        }

        .manga-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;
        }

        .manga-card {
            background: var(--bg-card); border-radius: var(--radius);
            overflow: hidden; box-shadow: var(--shadow); display: flex;
            flex-direction: column; cursor: pointer; transition: transform 0.2s ease;
        }

        .manga-card:hover { transform: translateY(-4px); }

        .cover-wrapper {
            position: relative; width: 100%; padding-top: 145%; background: #E4E7EB;
        }

        .cover-wrapper img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .card-content {
            padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between;
        }

        .manga-title {
            font-size: 0.9rem; font-weight: 600; line-height: 1.3; margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .manga-status { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; }

        .btn-add {
            width: 100%; padding: 8px; border: none; border-radius: 8px;
            background: #F1F2F6; color: var(--text-main); font-size: 0.8rem;
            font-weight: 600; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 6px;
        }

        .btn-add.saved { background: #FFEAA7; color: #D63031; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px;
        }

        .modal-card {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative;
        }

        .close-modal {
            position: absolute; top: 14px; right: 14px; background: rgba(0, 0, 0, 0.5);
            color: white; border: none; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; z-index: 10;
        }

        .modal-header-bg {
            display: flex; gap: 16px; padding: 20px; background: #2F3542; color: white;
        }

        .modal-cover { width: 110px; height: 160px; object-fit: cover; border-radius: 8px; }
        .modal-header-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
        .modal-meta { font-size: 0.82rem; color: #A4B0BE; margin-bottom: 12px; }
        .modal-body { padding: 20px; }
        .synopsis { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }

        .action-selector {
            display: flex; gap: 8px; margin-bottom: 16px;
        }

        .action-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border-color);
            background: #F1F2F6; border-radius: 8px; font-size: 0.8rem;
            font-weight: 600; cursor: pointer; text-align: center;
        }

        .action-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        .read-links { display: flex; flex-direction: column; gap: 8px; }
        .read-btn {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: #F1F2F6; border-radius: 10px;
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.88rem;
        }

        .status-box {
            text-align: center; padding: 40px 20px; background: var(--bg-card); border-radius: var(--radius);
        }

        .status-box i { font-size: 2.5rem; color: var(--primary); margin-bottom: 12px; }

        @media (max-width: 480px) {
            .manga-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stats-grid-metric { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-book-open"></i></div>
            <div>
                <h1>Manga Fio</h1>
                <p id="sub-title">Tu Biblioteca & Estadísticas</p>
            </div>
        </div>
        
        <div class="lang-toggle">
            <button class="lang-btn active" id="btn-es" onclick="setLanguage('es')">ES 🇲🇽</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN 🇺🇸</button>
        </div>
    </header>

    <!-- NAVEGACIÓN DE 3 MENÚS -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-explore" onclick="switchTab('explore')">
            <i class="fa-compass fa-regular"></i> Explorar
        </button>
        <button class="tab-btn" id="tab-library" onclick="switchTab('library')">
            <i class="fa-bookmark fa-regular"></i> Mi Biblioteca
        </button>
        <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">
            <i class="fa-chart-pie fa-solid"></i> Estadísticas
        </button>
    </div>

    <!-- VISTA 1: EXPLORAR -->
    <div id="view-explore">
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="search-input" placeholder="Buscar manga en línea..." onkeypress="if(event.key==='Enter') searchManga()">
                <button onclick="searchManga()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="suggestions">
                <span>Sugeridos:</span>
                <button class="chip" onclick="quickSearch('Demon Slayer')">Demon Slayer</button>
                <button class="chip" onclick="quickSearch('Spy x Family')">Spy x Family</button>
                <button class="chip" onclick="quickSearch('One Piece')">One Piece</button>
                <button class="chip" onclick="quickSearch('Jujutsu Kaisen')">Jujutsu Kaisen</button>
            </div>
        </div>

        <div id="results-container"></div>
    </div>

    <!-- VISTA 2: MI BIBLIOTECA (ORGANIZADA) -->
    <div id="view-library" style="display: none;">
        <div class="lib-filters">
            <button class="lib-chip active" id="filter-all" onclick="filterLibrary('all')">Todos</button>
            <button class="lib-chip" id="filter-reading" onclick="filterLibrary('reading')">📖 Leyendo</button>
            <button class="lib-chip" id="filter-plan" onclick="filterLibrary('plan')">⏳ Por Leer</button>
            <button class="lib-chip" id="filter-completed" onclick="filterLibrary('completed')">✅ Leídos</button>
        </div>
        <div id="library-container"></div>
    </div>

    <!-- VISTA 3: ESTADÍSTICAS GAMIFICADAS -->
    <div id="view-stats" style="display: none;">
        <div class="stats-container">
            <div class="stats-hero-card">
                <div style="font-size: 0.85rem; color: #A4B0BE;">Progreso Otaku</div>
                <div class="rank-badge" id="rank-badge">🐣 Lector Novato</div>

                <div class="progress-track">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #A4B0BE; margin-top: 6px;">
                    <span id="progress-pct">0% completado</span>
                    <span id="next-rank-text">Faltan 1 manga leído</span>
                </div>
            </div>

            <div class="stats-grid-metric">
                <div class="metric-card">
                    <div class="metric-num" id="stat-completed">0</div>
                    <div class="metric-lbl">Leídos</div>
                </div>
                <div class="metric-card">
                    <div class="metric-num" id="stat-reading" style="color: #FFA502;">0</div>
                    <div class="metric-lbl">Leyendo</div>
                </div>
                <div class="metric-card">
                    <div class="metric-num" id="stat-plan" style="color: #70A1FF;">0</div>
                    <div class="metric-lbl">Por Leer</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLE -->
    <div class="modal-overlay" id="modal-detail" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-header-bg">
                <img id="modal-img" src="" class="modal-cover" alt="Cover">
                <div class="modal-header-info">
                    <h2 class="modal-title" id="modal-title">---</h2>
                    <div class="modal-meta" id="modal-meta">---</div>
                </div>
            </div>
            <div class="modal-body">
                <div class="section-title" style="font-weight: 600; margin-bottom: 8px;">Estado en mi lista:</div>
                <div class="action-selector">
                    <button class="action-btn" id="btn-status-plan" onclick="setMangaStatus('plan')">⏳ Por Leer</button>
                    <button class="action-btn" id="btn-status-reading" onclick="setMangaStatus('reading')">📖 Leyendo</button>
                    <button class="action-btn" id="btn-status-completed" onclick="setMangaStatus('completed')">✅ Leído</button>
                </div>

                <div class="section-title" style="font-weight: 600; margin-bottom: 8px;">Sinopsis</div>
                <div class="synopsis" id="modal-synopsis">---</div>

                <div class="section-title" style="font-weight: 600; margin-bottom: 8px;">Opciones de lectura gratis:</div>
                <div class="read-links" id="modal-links"></div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'es';
        let currentTab = 'explore';
        let activeLibraryFilter = 'all';
        let searchResults = [];
        let selectedManga = null;
        let myLibrary = JSON.parse(localStorage.getItem('manga_fio_library_v2') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            updateStatsUI();
            quickSearch('Demon Slayer');
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            renderResults(searchResults);
            if (currentTab === 'library') renderLibrary();
            if (selectedManga) fillModalData(selectedManga);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            document.getElementById('view-explore').style.display = tab === 'explore' ? 'block' : 'none';
            document.getElementById('view-library').style.display = tab === 'library' ? 'block' : 'none';
            document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';

            if (tab === 'library') renderLibrary();
            if (tab === 'stats') updateStatsUI();
        }

        function quickSearch(term) {
            document.getElementById('search-input').value = term;
            searchManga();
        }

        async function searchManga() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const container = document.getElementById('results-container');
            container.innerHTML = `
                <div class="status-box">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Buscando mangas en vivo por internet...</p>
                </div>
            `;

            try {
                const res = await fetch(`https://kitsu.io/api/edge/manga?filter[text]=${encodeURIComponent(query)}&page[limit]=16`);
                const data = await res.json();

                if (data.data && data.data.length > 0) {
                    searchResults = data.data.map(item => {
                        const attr = item.attributes;
                        const canonicalTitle = attr.canonicalTitle || "Título no disponible";
                        return {
                            id: item.id,
                            title_es: attr.titles.es || canonicalTitle,
                            title_en: attr.titles.en || attr.titles.en_jp || canonicalTitle,
                            cover: (attr.posterImage && attr.posterImage.medium) ? attr.posterImage.medium : 'https://via.placeholder.com/150x220?text=Sin+Portada',
                            synopsis_es: attr.synopsis || "Sinopsis no disponible.",
                            synopsis_en: attr.synopsis || "Synopsis not available.",
                            status: attr.status === 'finished' ? 'Finalizado' : 'En emisión',
                            score: attr.averageRating ? (attr.averageRating / 10).toFixed(1) : '8.0'
                        };
                    });
                    renderResults(searchResults);
                } else {
                    showNoResults();
                }
            } catch (err) {
                showNoResults();
            }
        }

        function showNoResults() {
            document.getElementById('results-container').innerHTML = `
                <div class="status-box">
                    <i class="fa-solid fa-ghost"></i>
                    <p>No se encontraron resultados para esta búsqueda.</p>
                </div>
            `;
        }

        function renderResults(list) {
            const container = document.getElementById('results-container');
            if (!list || list.length === 0) return;

            let html = '<div class="manga-grid">';
            list.forEach(manga => {
                const title = currentLang === 'es' ? manga.title_es : manga.title_en;
                const savedItem = myLibrary.find(item => item.id === manga.id);
                
                let btnLabel = "+ Mi Lista";
                if (savedItem) {
                    if (savedItem.userStatus === 'completed') btnLabel = "✅ Leído";
                    if (savedItem.userStatus === 'reading') btnLabel = "📖 Leyendo";
                    if (savedItem.userStatus === 'plan') btnLabel = "⏳ Por Leer";
                }

                html += `
                    <div class="manga-card" onclick="openModal('${manga.id}')">
                        <div class="cover-wrapper">
                            <img src="${manga.cover}" alt="${title}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <div>
                                <div class="manga-title">${title}</div>
                                <div class="manga-status">⭐ ${manga.score}</div>
                            </div>
                            <button class="btn-add ${savedItem ? 'saved' : ''}">
                                <span>${btnLabel}</span>
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function openModal(mangaId) {
            const manga = searchResults.find(m => m.id === mangaId) || myLibrary.find(m => m.id === mangaId);
            if (!manga) return;

            selectedManga = manga;
            fillModalData(manga);
            document.getElementById('modal-detail').style.display = 'flex';
        }

        function fillModalData(manga) {
            const title = currentLang === 'es' ? manga.title_es : manga.title_en;
            const synopsis = currentLang === 'es' ? manga.synopsis_es : manga.synopsis_en;
            
            document.getElementById('modal-img').src = manga.cover;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-meta').innerText = `⭐ ${manga.score} | Estado: ${manga.status}`;
            document.getElementById('modal-synopsis').innerText = synopsis;

            const savedItem = myLibrary.find(item => item.id === manga.id);
            const currentStatus = savedItem ? savedItem.userStatus : null;

            ['plan', 'reading', 'completed'].forEach(st => {
                const btn = document.getElementById(`btn-status-${st}`);
                btn.className = `action-btn ${currentStatus === st ? 'active' : ''}`;
            });

            const searchTitle = encodeURIComponent(title);
            document.getElementById('modal-links').innerHTML = `
                <a href="https://mangadex.org/search?q=${searchTitle}" target="_blank" class="read-btn">
                    <span><i class="fa-solid fa-book-reader" style="color:#FF4757"></i> Leer en MangaDex (Oficial)</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                <a href="https://www.google.com/search?q=leer+manga+${searchTitle}+online+gratis+español" target="_blank" class="read-btn">
                    <span><i class="fa-solid fa-magnifying-glass" style="color:#2ED573"></i> Buscar en Google</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            `;
        }

        function setMangaStatus(status) {
            if (!selectedManga) return;

            const index = myLibrary.findIndex(m => m.id === selectedManga.id);
            if (index >= 0) {
                if (myLibrary[index].userStatus === status) {
                    myLibrary.splice(index, 1); // Quitar si toca el mismo botón
                } else {
                    myLibrary[index].userStatus = status;
                }
            } else {
                myLibrary.push({ ...selectedManga, userStatus: status });
            }

            if (status === 'completed' && typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            saveLibraryState();
            fillModalData(selectedManga);
        }

        function closeModal(e) { if (e.target.id === 'modal-detail') closeModalDirect(); }
        function closeModalDirect() { document.getElementById('modal-detail').style.display = 'none'; selectedManga = null; }

        function saveLibraryState() {
            localStorage.setItem('manga_fio_library_v2', JSON.stringify(myLibrary));
            renderResults(searchResults);
            if (currentTab === 'library') renderLibrary();
            updateStatsUI();
        }

        function filterLibrary(cat) {
            activeLibraryFilter = cat;
            document.querySelectorAll('.lib-chip').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${cat}`).classList.add('active');
            renderLibrary();
        }

        function renderLibrary() {
            const container = document.getElementById('library-container');

            let list = myLibrary;
            if (activeLibraryFilter !== 'all') {
                list = myLibrary.filter(m => m.userStatus === activeLibraryFilter);
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="status-box">
                        <i class="fa-regular fa-bookmark"></i>
                        <p>No tienes mangas en esta lista aún. ¡Explora y agrega tus lecturas!</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="manga-grid">';
            list.forEach(manga => {
                const title = currentLang === 'es' ? manga.title_es : manga.title_en;
                let statusBadge = "⏳ Por Leer";
                if (manga.userStatus === 'reading') statusBadge = "📖 Leyendo";
                if (manga.userStatus === 'completed') statusBadge = "✅ Leído";

                html += `
                    <div class="manga-card" onclick="openModal('${manga.id}')">
                        <div class="cover-wrapper">
                            <img src="${manga.cover}" alt="${title}">
                        </div>
                        <div class="card-content">
                            <div class="manga-title">${title}</div>
                            <button class="btn-add saved">
                                <span>${statusBadge}</span>
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // CÁLCULO EXCLUSIVO SOBRE MANGAS LEÍDOS / COMPLETADOS
        function updateStatsUI() {
            const completedCount = myLibrary.filter(m => m.userStatus === 'completed').length;
            const readingCount = myLibrary.filter(m => m.userStatus === 'reading').length;
            const planCount = myLibrary.filter(m => m.userStatus === 'plan').length;

            document.getElementById('stat-completed').innerText = completedCount;
            document.getElementById('stat-reading').innerText = readingCount;
            document.getElementById('stat-plan').innerText = planCount;

            let rank = "🐣 Lector Novato";
            let nextTarget = 3;

            if (completedCount >= 10) {
                rank = "👑 Rey de los Otakus";
                nextTarget = completedCount + 5;
            } else if (completedCount >= 5) {
                rank = "🔥 Super Saiyajin";
                nextTarget = 10;
            } else if (completedCount >= 3) {
                rank = "⚔️ Cazador de Demonios";
                nextTarget = 5;
            } else if (completedCount >= 1) {
                rank = "⚡ Aprendiz Ninja";
                nextTarget = 3;
            }

            document.getElementById('rank-badge').innerText = rank;

            const percentage = Math.min(100, Math.round((completedCount / nextTarget) * 100));
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-pct').innerText = `${percentage}% hacia el siguiente nivel`;

            const remaining = nextTarget - completedCount;
            document.getElementById('next-rank-text').innerText = remaining > 0 
                ? `Faltan ${remaining} manga(s) leídos` 
                : '¡Meta alcanzada!';
        }
    </script>
</body>
</html>
